name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 29.4
          - 30.2
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '22'
    - uses: cachix/install-nix-action@v31
    - name: Install Emacs with image support
      run: |
        case "${{ matrix.emacs_version }}" in
          29.4)
            nix profile install github:NixOS/nixpkgs/nixos-24.05#emacs29-pgtk
            ;;
          30.2)
            nix profile install github:NixOS/nixpkgs/nixos-25.05#emacs30-pgtk
            ;;
        esac
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
        "$HOME/.nix-profile/bin/emacs" --batch -Q --eval \
          "(unless (image-type-available-p 'png) (error \"PNG unavailable\"))"
    - uses: conao3/setup-cask@master

    - name: Run JavaScript lint
      run: |
        npm ci --prefix scripts
        npm run lint --prefix scripts
        npm ci --prefix integration/fixture
        npm run lint --prefix integration/fixture

    - name: Install Markdown Tree-sitter grammars
      run: |
        emacs --batch -Q \
          --eval "(progn
            (require 'treesit)
            (setq treesit-language-source-alist
                  '((markdown
                     \"https://github.com/tree-sitter-grammars/tree-sitter-markdown\"
                     \"split_parser\"
                     \"tree-sitter-markdown/src\")
                    (markdown-inline
                     \"https://github.com/tree-sitter-grammars/tree-sitter-markdown\"
                     \"split_parser\"
                     \"tree-sitter-markdown-inline/src\")))
            (setq user-emacs-directory
                  (file-name-as-directory (expand-file-name \".cask\")))
            (add-to-list 'treesit-extra-load-path
                         (expand-file-name \"tree-sitter\" user-emacs-directory))
            (treesit-install-language-grammar 'markdown)
            (treesit-install-language-grammar 'markdown-inline)
            (unless (treesit-language-available-p 'markdown)
              (error \"Markdown grammar unavailable\"))
            (unless (treesit-language-available-p 'markdown-inline)
              (error \"Markdown inline grammar unavailable\")))"

    - name: Run tests
      run: UNDERCOVER_FORCE=true UNDERCOVER_CONFIG='("*.el" (:report-format codecov) (:send-report nil) (:exclude "*-tests.el"))' make test

    - name: Run Markdown tests
      run: UNDERCOVER_FORCE=true UNDERCOVER_CONFIG='("*.el" (:report-format codecov) (:send-report nil) (:exclude "*-tests.el"))' make markdown-test

    - name: Run integration tests
      run: |
        npm install -g --ignore-scripts @earendil-works/pi-coding-agent
        UNDERCOVER_FORCE=true UNDERCOVER_CONFIG='("*.el" (:report-format codecov) (:send-report nil) (:exclude "*-tests.el"))' make integration

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
